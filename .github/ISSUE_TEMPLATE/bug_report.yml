name: BUG 报告
description: 报告一个可复现的缺陷
labels: [type:bug]
body:
  - type: markdown
    attributes:
      value: |
        请尽量提供可复现的最小步骤与日志，缺失复现信息的 issue 很难被修复。

  - type: textarea
    id: description
    attributes:
      label: 缺陷描述
      description: 一句话说清出了什么问题。
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 xxx
        2. 点击 xxx
        3. 出现 xxx
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: 期望行为 与 实际行为
      placeholder: |
        期望：xxx
        实际：xxx
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      description: p0=核心功能不可用/数据损坏；p1=主要功能受损有绕过方案；p2=体验问题。
      options:
        - p1 - 主要功能受损
        - p2 - 体验问题
        - p0 - 阻断使用/数据损坏
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 应用版本
      description: 设置页可见，或 GitHub Release 版本号，如 v0.9.1。
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
        - 多平台
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志 / 截图
      description: 有日志、截图或录屏请附上，Electron 主进程报错尤其重要。
    validations:
      required: false
