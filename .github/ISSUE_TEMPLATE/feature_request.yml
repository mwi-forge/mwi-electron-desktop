name: 需求 / 功能建议
description: 提出一个新功能或改进需求
labels: [type:feat]
body:
  - type: markdown
    attributes:
      value: |
        先写清动机，再谈方案——动机决定这个需求做不做，方案只决定怎么做。

  - type: textarea
    id: motivation
    attributes:
      label: 背景与动机
      description: 要解决什么问题？谁在什么场景下需要它？不做会怎样？
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 怎么算做完？写出可验证的标准，将来直接作为测试用例来源。
      placeholder: |
        - [ ] 用户可以 xxx
        - [ ] 关闭窗口后 xxx 状态保持
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 方案设想（可选）
      description: 有初步思路就写，没有可以留空——实现方案允许在 PR 阶段调整。

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与权衡（可选）
      description: 考虑过哪些别的做法，为什么倾向这个。
