name: pr-check

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit-test + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          (cd node_modules/electron && node install.js)

      - name: Unit tests + total-line coverage gate (lines >= 60%)
        run: >
          npx c8 --check-coverage --lines 60
          --exclude 'scripts/**' --exclude 'tests/**' --exclude 'lib/__tests__/**'
          --reporter text --reporter json-summary --reporter json
          npm test

      - name: Warn when coverage data is empty
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json');
            const files = Object.keys(s).filter((k) => k !== 'total');
            if (files.length === 0) {
              console.log('::warning::当前测试范围内无 V8 可插桩模块（sandbox 式测试经 vm 加载源码），总行覆盖率门禁空转。develop 的 lib 测试合入 main 后自动生效。');
            } else {
              console.log('覆盖率统计文件数: ' + files.length + '，总行覆盖: ' + s.total.lines.pct + '%');
            }
          "

      - name: Changed-line coverage gate (diffLines >= 70%)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: node scripts/coverage-diff-gate.mjs --coverage coverage/coverage-final.json --base "origin/$PR_BASE" --diff-lines 70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage
          retention-days: 7
