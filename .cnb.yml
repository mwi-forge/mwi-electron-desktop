main:
  push:
    - name: linux-build
      stages:
        - name: install-node-20
          script: |
            set -e
            NODE_VERSION=20.18.0
            curl -fsSL https://registry.npmmirror.com/-/binary/node/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz -o /tmp/node.tar.gz
            tar -xzf /tmp/node.tar.gz -C /usr/local
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/node /usr/local/bin/node
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npm /usr/local/bin/npm
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npx /usr/local/bin/npx
            node --version
            npm --version
        - name: install-deps
          script: |
            set -e
            npm ci --ignore-scripts
            cd node_modules/electron && node install.js && cd ../..
            echo 'electron binary downloaded'
        - name: build-linux
          script: |
            set -e
            NODE_OPTIONS="--experimental-require-module" npm run dist:linux
        - name: list-output
          script: |
            set -e
            ls -la dist/
            du -h dist/* 2>/dev/null | head -20
