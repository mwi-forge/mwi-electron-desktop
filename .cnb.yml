main:
  push:
    - name: linux-build
      stages:
        - name: install-node-22
          script: |
            set -e
            NODE_VERSION=22.10.0
            curl -fsSL https://registry.npmmirror.com/-/binary/node/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz -o /tmp/node.tar.xz
            tar -xJf /tmp/node.tar.xz -C /usr/local
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/node /usr/local/bin/node
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npm /usr/local/bin/npm
            ln -sf /usr/local/node-v${NODE_VERSION}-linux-x64/bin/npx /usr/local/bin/npx
            node --version
            npm --version
        - name: install-deps
          script: |
            set -e
            npm config set registry https://registry.npmmirror.com
            npm config set electron_mirror https://npmmirror.com/mirrors/electron/
            npm ci --ignore-scripts --no-audit --no-fund
            cd node_modules/electron && node install.js && cd ../..
            echo 'electron binary downloaded'
        - name: build-linux
          script: |
            set -e
            npm run dist:linux
        - name: list-output
          script: |
            set -e
            ls -la dist/
            du -h dist/* 2>/dev/null | head -20
