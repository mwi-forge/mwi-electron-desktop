<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MWI Assistant</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
    pointer-events: none;
  }
  .mascot-area {
    position: absolute;
    right: 0; bottom: 0;
    width: 60px; height: 40px;
    pointer-events: auto;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .mascot-area:active { cursor: grabbing; }

  .ch-body {
    fill: #2d2e44;
    stroke: #98a7e9;
    stroke-width: 0.5;
    transition: fill 0.15s, stroke 0.15s;
  }
  .mascot-area:hover .ch-body {
    fill: #39415a;
    stroke: #b3c0f5;
  }
  .ch-eyes { animation: mwi-eye-look 16s ease-in-out infinite; }
  .ch-eye {
    fill: #d4d4d4;
    transition: fill 0.15s;
    transform-box: fill-box;
    transform-origin: center;
    animation: mwi-eye-blink 11s ease-in-out infinite;
  }
  .mascot-area:hover .ch-eye { fill: #fff; }

  @keyframes mwi-eye-look {
    0%, 42% { transform: translate(0); }
    47%, 53% { transform: translate(2px); }
    58%, 80% { transform: translate(0); }
    84%, 90% { transform: translate(-2px); }
    95%, 100% { transform: translate(0); }
  }
  @keyframes mwi-eye-blink {
    0%, 94%, 100% { transform: scaleY(1); }
    96.5%, 98% { transform: scaleY(0.12); }
  }
  @keyframes mwi-eye-blink-once {
    0%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ch-eyes, .ch-eye { animation: none; }
  }

  .expand-panel {
    display: none;
    position: absolute;
    left: 0; top: 0;
    width: 300px;
    height: 400px;
    background: rgba(15, 15, 15, 0.95);
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    pointer-events: auto;
  }
  .expanded .expand-panel { display: flex; flex-direction: column; }
  .expanded .mascot-area { right: auto; left: 300px; }
</style>
</head>
<body>
  <div class="mascot-area" id="mascotArea">
    <svg width="60" height="40" viewBox="0 0 32 22" fill="none"
         role="img" aria-label="MWI 吉祥物">
      <rect class="ch-body" x="1" y="1" width="30" height="20" rx="6"/>
      <g class="ch-eyes">
        <rect class="ch-eye" x="11.8" y="7" width="2.8" height="8" rx="1.4"/>
        <rect class="ch-eye" x="17.4" y="7" width="2.8" height="8" rx="1.4"/>
      </g>
    </svg>
  </div>
  <div class="expand-panel" id="expandPanel">
    <!-- 预留：NL 输入面板 / 状态反馈 / 方案一对接 -->
  </div>
<script src="./js/assistant-overlay.js"></script>
</body>
</html>
